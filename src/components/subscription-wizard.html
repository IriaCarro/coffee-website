<section aria-labelledby="subscription-wizard-title" class="py-12 px-4 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-2xl">
    <!-- Progress Bar -->
    <div class="mb-8">
      <div id="subscription-progress-track" class="wizard-progress-track theme-transition" role="progressbar"
        aria-label="Progreso de la suscripción" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1"
        aria-valuetext="Paso 1 de 3">
        <div id="subscription-progress-bar" class="wizard-progress-bar" aria-hidden="true"></div>
      </div>
      <ol class="wizard-progress-steps" aria-label="Pasos de la suscripción">
        <li class="wizard-progress-step">
          <span class="step-indicator active mb-2" data-step="1" aria-current="step">1</span>
          <span class="wizard-progress-label">Tu café</span>
        </li>
        <li class="wizard-progress-step">
          <span class="step-indicator mb-2" data-step="2">2</span>
          <span class="wizard-progress-label">Tu plan</span>
        </li>
        <li class="wizard-progress-step">
          <span class="step-indicator mb-2" data-step="3">3</span>
          <span class="wizard-progress-label">Entrega</span>
        </li>
      </ol>
    </div>

    <!-- Wizard Card -->
    <div class="wizard-card">
      <form id="subscription-wizard-form" class="space-y-6">
        <!-- Step 1: Choose Coffee -->
        <fieldset class="wizard-step active" data-step="1">
          <legend class="wizard-step-title">¿Qué café prefieres?</legend>
          <p class="wizard-step-description">Selecciona tu café favorito para empezar</p>
          <div class="wizard-option-list">
            <label class="radio-label">
              <input type="radio" name="coffee" value="etiopia" checked>
              <span class="wizard-option-content">
                <span class="text-2xl" aria-hidden="true">🌸</span>
                <strong class="wizard-option-title">Etiopía Floral</strong>
                <span class="wizard-option-description">14,90 €/mes</span>
              </span>
            </label>
            <label class="radio-label">
              <input type="radio" name="coffee" value="colombia">
              <span class="wizard-option-content">
                <span class="text-2xl" aria-hidden="true">🍫</span>
                <strong class="wizard-option-title">Colombia Caramelo</strong>
                <span class="wizard-option-description">12,90 €/mes</span>
              </span>
            </label>
            <label class="radio-label">
              <input type="radio" name="coffee" value="kenia">
              <span class="wizard-option-content">
                <span class="text-2xl" aria-hidden="true">🫐</span>
                <strong class="wizard-option-title">Kenia Frutos Rojos</strong>
                <span class="wizard-option-description">15,50 €/mes</span>
              </span>
            </label>
          </div>
        </fieldset>

        <!-- Step 2: Choose Plan -->
        <fieldset class="wizard-step hidden" data-step="2">
          <legend class="wizard-step-title">Elige tu plan</legend>
          <p class="wizard-step-description">Selecciona la frecuencia y cantidad</p>
          <div class="wizard-option-list">
            <label class="radio-label">
              <input type="radio" name="plan" value="monthly" checked>
              <span class="wizard-option-content">
                <strong class="wizard-option-title">Plan Mensual</strong>
                <span class="wizard-option-description">1 bolsa de 250g cada mes</span>
              </span>
              <span class="wizard-option-price">14,90 €</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="plan" value="biweekly">
              <span class="wizard-option-content">
                <strong class="wizard-option-title">Plan Quincenal</strong>
                <span class="wizard-option-description">1 bolsa de 250g cada 15 días</span>
              </span>
              <span class="wizard-option-price">29,80 €</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="plan" value="weekly">
              <span class="wizard-option-content">
                <strong class="wizard-option-title">Plan Semanal</strong>
                <span class="wizard-option-description">1 bolsa de 250g cada semana</span>
              </span>
              <span class="wizard-option-price">59,60 €</span>
            </label>
          </div>
        </fieldset>

        <!-- Step 3: Delivery -->
        <fieldset class="wizard-step hidden" data-step="3">
          <legend class="wizard-step-title">Datos de entrega</legend>
          <p class="wizard-step-description">¿Dónde te enviamos tu café?</p>
          <div class="space-y-4">
            <div>
              <label for="subscription-name" class="form-label">Nombre completo</label>
              <input type="text" id="subscription-name" name="name" placeholder="Tu nombre">
            </div>
            <div>
              <label for="subscription-email" class="form-label">Email</label>
              <input type="email" id="subscription-email" name="email" placeholder="tu@email.com">
            </div>
            <div>
              <label for="subscription-address" class="form-label">Dirección de envío</label>
              <input type="text" id="subscription-address" name="address" placeholder="Calle, número, piso...">
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label for="subscription-city" class="form-label">Ciudad</label>
                <input type="text" id="subscription-city" name="city" placeholder="Madrid">
              </div>
              <div>
                <label for="subscription-zip" class="form-label">Código postal</label>
                <input type="text" id="subscription-zip" name="zip" placeholder="28001">
              </div>
            </div>
          </div>
        </fieldset>

        <!-- Navigation Buttons -->
        <nav aria-label="Navegación de pasos" class="flex items-center justify-between gap-4 pt-6">
          <button type="button" id="subscription-btn-prev" disabled
            class="btn-primary opacity-50 cursor-not-allowed">&larr; Anterior</button>
          <span class="text-sm font-medium text-nav">Paso <span id="subscription-current-step">1</span> de 3</span>
          <button type="button" id="subscription-btn-next" class="btn-primary">Siguiente &rarr;</button>
        </nav>
      </form>
    </div>
  </div>
</section>
