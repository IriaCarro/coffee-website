<li class="menu-item">
  <article class="menu-card hover-zoom">
    <div class="menu-card__media">
      <img
        class="menu-card__image hover-zoom__target"
        src="{{image}}"
        alt="{{alt}}"
        loading="lazy"
      />
    </div>
    <div class="menu-card__content">
      <h3 class="menu-card__title">{{name}}</h3>
      <p class="menu-card__description">{{description}}</p>
      <p class="menu-card__price">{{formattedPrice}}</p>
    </div>
  </article>
</li>
