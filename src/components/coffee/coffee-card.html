<li class="@container">
  <article
    class="hover-zoom border-border-subtle bg-surface-container has-focus-visible:outline-focus-ring relative block h-full overflow-hidden rounded-lg border shadow-md transition duration-300 hover:shadow-xl has-focus-visible:outline-2 has-focus-visible:outline-offset-4 hover:motion-safe:-translate-y-2 @xs:grid @xs:grid-cols-[10rem_1fr] @xs:items-center"
  >
    <div class="relative aspect-video overflow-hidden @xs:aspect-square">
      <img
        class="absolute inset-0 h-full w-full scale-150 object-cover opacity-80 blur-2xl"
        src="{{packImage120}}"
        alt=""
        aria-hidden="true"
        loading="{{loading}}"
        decoding="async"
      />
      <img
        class="hover-zoom__target relative h-full w-full object-contain py-3 drop-shadow-xl"
        src="{{packImage300}}"
        srcset="
          {{packImage200}} 200w,
          {{packImage300}} 300w,
          {{packImage400}} 400w,
          {{packImage}}    800w
        "
        sizes="(min-width: 640px) 136px, 96px"
        alt="{{t:coffees.packAlt}} {{name}}, {{production}}"
        loading="{{loading}}"
        fetchpriority="{{priority}}"
        decoding="async"
      />
    </div>
    <div class="p-5 @xs:p-4">
      <h3 class="heading heading--item mb-2 @xs:mb-1 @xs:text-lg">{{name}}</h3>
      <p class="text-text-secondary mb-4 text-sm @xs:mb-2">{{description}}</p>
      <div class="flex flex-wrap items-center justify-between gap-2">
        <p class="text-accent text-lg font-bold">{{formattedPrice}}</p>
        <a
          href="/coffees/{{id}}/"
          class="btn btn--secondary px-3 py-1.5 text-sm no-underline after:absolute after:inset-0 after:content-['']"
        >
          {{t:coffees.card.details}}
          <span class="sr-only">de {{name}}</span>
        </a>
      </div>
    </div>
  </article>
</li>
