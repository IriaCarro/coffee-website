<label for="{{id}}" class="{{class}}">
  <span class="form__label">{{label}}</span>
  <input
    type="{{type}}"
    id="{{id}}"
    name="{{name}}"
    placeholder="{{placeholder}}"
    autocomplete="{{autocomplete}}"
    class="peer"
    {{extra}}
    required
  />
  <span class="form__error" id="{{id}}-error">{{error}}</span>
</label>
