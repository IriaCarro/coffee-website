<label
  class="relative flex cursor-pointer items-center rounded-lg border-2 border-(--border-input) bg-(--surface-transparent) p-4 transition-all duration-300 hover:bg-(--accent)/10"
>
  <input type="radio" name="coffee" value="{{id}}" {{checked}} />
  <img
    class="ml-3 h-20 w-16 shrink-0 object-contain sm:ml-4"
    src="{{packImage400}}"
    width="64"
    height="80"
    loading="lazy"
    alt="Pack de café {{name}}, {{production}}"
  />
  <span class="ml-3 flex min-w-0 flex-1 flex-col sm:ml-4">
    <strong class="font-medium text-(--text-primary)">{{name}}</strong>
    <span class="text-sm text-(--text-secondary)">{{description}}</span>
    <span class="text-sm text-(--text-secondary)">{{formattedPrice}}/mes</span>
  </span>
</label>
