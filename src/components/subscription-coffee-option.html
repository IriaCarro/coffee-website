<label class="wizard__radio-label">
  <input type="radio" name="coffee" value="{{id}}" {{checked}} />
  <img
    class="subscription__option-image"
    src="{{packImage}}"
    alt="Pack de café {{name}}, {{production}}"
  />
  <span class="wizard__option-content">
    <strong class="wizard__option-title">{{name}}</strong>
    <span class="wizard__option-description">{{description}}</span>
    <span class="wizard__option-description">{{formattedPrice}}/mes</span>
  </span>
</label>
