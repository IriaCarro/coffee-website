<!-- Theme button -->
<button type="button" data-theme-toggle aria-label="Cambiar tema" aria-haspopup="listbox" aria-expanded="false"
  class="theme-toggle">
  <img data-theme-icon alt="" class="h-5 w-5" />
  <span data-theme-label class="text-sm font-medium">Light</span>
  <img data-theme-chevron alt="Chevron down" aria-hidden="true"
    class="h-4 w-4 transition-transform duration-200" />
</button>

<!-- Theme menu -->
<ul data-theme-menu role="listbox" aria-label="Seleccionar tema" class="theme-menu hidden">
  <li role="option" data-theme="light" aria-selected="false" class="theme-menu-option">
    <img data-theme-icon-option="light" alt="" class="h-5 w-5" />
    <span class="text-sm font-medium">Light</span>
  </li>
  <li role="option" data-theme="dark" aria-selected="false" class="theme-menu-option">
    <img data-theme-icon-option="dark" alt="" class="h-5 w-5" />
    <span class="text-sm font-medium">Dark</span>
  </li>
  <li role="option" data-theme="matcha" aria-selected="false" class="theme-menu-option">
    <img data-theme-icon-option="matcha" alt="" class="h-5 w-5" />
    <span class="text-sm font-medium">Matcha</span>
  </li>
  <li role="option" data-theme="cafe" aria-selected="false" class="theme-menu-option">
    <img data-theme-icon-option="cafe" alt="" class="h-5 w-5" />
    <span class="text-sm font-medium">Café</span>
  </li>
  <li role="option" data-theme="blue" aria-selected="false" class="theme-menu-option">
    <img data-theme-icon-option="blue" alt="" class="h-5 w-5" />
    <span class="text-sm font-medium">Blue</span>
  </li>
  <li role="option" data-theme="violet" aria-selected="false" class="theme-menu-option">
    <img data-theme-icon-option="violet" alt="" class="h-5 w-5" />
    <span class="text-sm font-medium">Violet</span>
  </li>
</ul>
