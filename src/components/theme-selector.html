<!-- Theme button -->
<button type="button" data-theme-toggle aria-label="Cambiar tema" aria-expanded="false" class="theme-toggle">
  <img data-theme-icon alt="" class="h-5 w-5" />
  <span data-theme-label class="text-sm font-medium">Claro</span>
  <img data-theme-chevron alt="" aria-hidden="true" class="h-4 w-4 transition-transform duration-200" />
</button>

<!-- Theme menu -->
<ul data-theme-menu aria-label="Seleccionar tema" class="theme-menu hidden">
  <li>
    <button type="button" data-theme="light" aria-pressed="false" class="theme-menu-option">
      <img data-theme-icon-option="light" alt="" class="h-5 w-5" />
      <span class="text-sm font-medium">Claro</span>
    </button>
  </li>
  <li>
    <button type="button" data-theme="dark" aria-pressed="false" class="theme-menu-option">
      <img data-theme-icon-option="dark" alt="" class="h-5 w-5" />
      <span class="text-sm font-medium">Oscuro</span>
    </button>
  </li>
  <li>
    <button type="button" data-theme="matcha" aria-pressed="false" class="theme-menu-option">
      <img data-theme-icon-option="matcha" alt="" class="h-5 w-5" />
      <span class="text-sm font-medium">Matcha</span>
    </button>
  </li>
  <li>
    <button type="button" data-theme="cafe" aria-pressed="false" class="theme-menu-option">
      <img data-theme-icon-option="cafe" alt="" class="h-5 w-5" />
      <span class="text-sm font-medium">Café</span>
    </button>
  </li>
  <li>
    <button type="button" data-theme="blue" aria-pressed="false" class="theme-menu-option">
      <img data-theme-icon-option="blue" alt="" class="h-5 w-5" />
      <span class="text-sm font-medium">Azul</span>
    </button>
  </li>
  <li>
    <button type="button" data-theme="violet" aria-pressed="false" class="theme-menu-option">
      <img data-theme-icon-option="violet" alt="" class="h-5 w-5" />
      <span class="text-sm font-medium">Violeta</span>
    </button>
  </li>
</ul>
