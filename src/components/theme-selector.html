<!-- Theme button -->
<button
  type="button"
  data-theme-toggle
  aria-label="Cambiar tema"
  aria-expanded="false"
  class="theme-selector__toggle"
>
  <img data-theme-icon alt="" class="theme-selector__toggle-icon" />
  <span data-theme-label class="theme-selector__toggle-label">Claro</span>
  <img
    data-theme-chevron
    alt=""
    aria-hidden="true"
    class="theme-selector__toggle-chevron"
  />
</button>

<!-- Theme menu -->
<ul
  data-theme-menu
  aria-label="Seleccionar tema"
  class="theme-selector__menu hidden"
>
  <li>
    <button
      type="button"
      data-theme="light"
      aria-pressed="false"
      class="theme-selector__menu-option"
    >
      <img
        data-theme-icon-option="light"
        alt=""
        class="theme-selector__menu-icon"
      />
      <span class="theme-selector__menu-label">Claro</span>
    </button>
  </li>
  <li>
    <button
      type="button"
      data-theme="dark"
      aria-pressed="false"
      class="theme-selector__menu-option"
    >
      <img
        data-theme-icon-option="dark"
        alt=""
        class="theme-selector__menu-icon"
      />
      <span class="theme-selector__menu-label">Oscuro</span>
    </button>
  </li>
  <li>
    <button
      type="button"
      data-theme="matcha"
      aria-pressed="false"
      class="theme-selector__menu-option"
    >
      <img
        data-theme-icon-option="matcha"
        alt=""
        class="theme-selector__menu-icon"
      />
      <span class="theme-selector__menu-label">Matcha</span>
    </button>
  </li>
  <li>
    <button
      type="button"
      data-theme="cafe"
      aria-pressed="false"
      class="theme-selector__menu-option"
    >
      <img
        data-theme-icon-option="cafe"
        alt=""
        class="theme-selector__menu-icon"
      />
      <span class="theme-selector__menu-label">Café</span>
    </button>
  </li>
  <li>
    <button
      type="button"
      data-theme="blue"
      aria-pressed="false"
      class="theme-selector__menu-option"
    >
      <img
        data-theme-icon-option="blue"
        alt=""
        class="theme-selector__menu-icon"
      />
      <span class="theme-selector__menu-label">Azul</span>
    </button>
  </li>
  <li>
    <button
      type="button"
      data-theme="violet"
      aria-pressed="false"
      class="theme-selector__menu-option"
    >
      <img
        data-theme-icon-option="violet"
        alt=""
        class="theme-selector__menu-icon"
      />
      <span class="theme-selector__menu-label">Violeta</span>
    </button>
  </li>
</ul>
