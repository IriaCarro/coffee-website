<button
  type="button"
  data-theme-toggle
  aria-expanded="false"
  class="group flex items-center gap-2 rounded-lg px-3 py-2 text-(--accent) transition-colors duration-200 hover:bg-(--accent)/10"
>
  <img data-theme-icon alt="" class="h-5 w-5" />
  <span class="sr-only">Cambiar tema, actual:</span>
  <span data-theme-label class="text-sm font-medium">Claro</span>
  <img
    data-theme-chevron
    alt=""
    aria-hidden="true"
    class="h-4 w-4 group-aria-expanded:rotate-180 motion-safe:transition-transform motion-safe:duration-200"
  />
</button>

<ul
  data-theme-menu
  aria-label="Seleccionar tema"
  class="absolute right-0 z-50 mt-2 hidden w-44 overflow-hidden rounded-lg border border-(--border-subtle) bg-(--surface-container) text-(--text-primary) shadow-lg transition-all duration-200"
>
  <li>
    <button
      type="button"
      data-theme="light"
      aria-pressed="false"
      class="flex w-full cursor-pointer items-center gap-3 px-4 py-2.5 text-left transition-colors duration-150 hover:bg-(--accent)/10 aria-pressed:bg-(--accent)/10 aria-pressed:font-bold"
    >
      <img data-theme-icon-option="light" alt="" class="h-5 w-5" />
      <span class="text-sm font-medium">Claro</span>
    </button>
  </li>
  <li>
    <button
      type="button"
      data-theme="dark"
      aria-pressed="false"
      class="flex w-full cursor-pointer items-center gap-3 px-4 py-2.5 text-left transition-colors duration-150 hover:bg-(--accent)/10 aria-pressed:bg-(--accent)/10 aria-pressed:font-bold"
    >
      <img data-theme-icon-option="dark" alt="" class="h-5 w-5" />
      <span class="text-sm font-medium">Oscuro</span>
    </button>
  </li>
  <li>
    <button
      type="button"
      data-theme="matcha"
      aria-pressed="false"
      class="flex w-full cursor-pointer items-center gap-3 px-4 py-2.5 text-left transition-colors duration-150 hover:bg-(--accent)/10 aria-pressed:bg-(--accent)/10 aria-pressed:font-bold"
    >
      <img data-theme-icon-option="matcha" alt="" class="h-5 w-5" />
      <span class="text-sm font-medium">Matcha</span>
    </button>
  </li>
  <li>
    <button
      type="button"
      data-theme="cafe"
      aria-pressed="false"
      class="flex w-full cursor-pointer items-center gap-3 px-4 py-2.5 text-left transition-colors duration-150 hover:bg-(--accent)/10 aria-pressed:bg-(--accent)/10 aria-pressed:font-bold"
    >
      <img data-theme-icon-option="cafe" alt="" class="h-5 w-5" />
      <span class="text-sm font-medium">Café</span>
    </button>
  </li>
  <li>
    <button
      type="button"
      data-theme="blue"
      aria-pressed="false"
      class="flex w-full cursor-pointer items-center gap-3 px-4 py-2.5 text-left transition-colors duration-150 hover:bg-(--accent)/10 aria-pressed:bg-(--accent)/10 aria-pressed:font-bold"
    >
      <img data-theme-icon-option="blue" alt="" class="h-5 w-5" />
      <span class="text-sm font-medium">Azul</span>
    </button>
  </li>
  <li>
    <button
      type="button"
      data-theme="violet"
      aria-pressed="false"
      class="flex w-full cursor-pointer items-center gap-3 px-4 py-2.5 text-left transition-colors duration-150 hover:bg-(--accent)/10 aria-pressed:bg-(--accent)/10 aria-pressed:font-bold"
    >
      <img data-theme-icon-option="violet" alt="" class="h-5 w-5" />
      <span class="text-sm font-medium">Violeta</span>
    </button>
  </li>
</ul>
