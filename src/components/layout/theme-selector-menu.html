<button
  type="button"
  data-theme-toggle
  aria-expanded="false"
  class="group text-accent hover:bg-accent/10 flex items-center gap-2 rounded-lg px-3 py-2 transition-colors duration-200"
>
  <img data-theme-icon alt="" class="h-5 w-5" />
  <span class="sr-only">{{t:theme.current}}</span>
  <span data-theme-label class="text-sm font-medium">{{t:theme.light}}</span>
  <span
    class="icon mask-[url(/icons/ui/chevron-down.svg)] text-base group-aria-expanded:rotate-180 motion-safe:transition-transform motion-safe:duration-200"
    aria-hidden="true"
  ></span>
</button>

<ul
  data-theme-menu
  aria-label="{{t:theme.menu}}"
  hidden
  class="border-border-subtle bg-surface-container text-text-primary absolute right-0 z-50 mt-2 w-44 overflow-hidden rounded-lg border shadow-lg transition-all duration-200"
>
  <li>
    <button
      type="button"
      data-theme-option="light"
      aria-pressed="false"
      class="hover:bg-accent/10 aria-pressed:bg-accent/10 flex w-full cursor-pointer items-center gap-3 px-4 py-2.5 text-left transition-colors duration-150 aria-pressed:font-bold"
    >
      <img
        data-theme-icon-option
        src="/icons/theme/sun.svg"
        alt=""
        class="h-5 w-5"
      />
      <span class="text-sm font-medium">{{t:theme.light}}</span>
    </button>
  </li>
  <li>
    <button
      type="button"
      data-theme-option="dark"
      aria-pressed="false"
      class="hover:bg-accent/10 aria-pressed:bg-accent/10 flex w-full cursor-pointer items-center gap-3 px-4 py-2.5 text-left transition-colors duration-150 aria-pressed:font-bold"
    >
      <img
        data-theme-icon-option
        src="/icons/theme/moon.svg"
        alt=""
        class="h-5 w-5"
      />
      <span class="text-sm font-medium">{{t:theme.dark}}</span>
    </button>
  </li>
  <li>
    <button
      type="button"
      data-theme-option="matcha"
      aria-pressed="false"
      class="hover:bg-accent/10 aria-pressed:bg-accent/10 flex w-full cursor-pointer items-center gap-3 px-4 py-2.5 text-left transition-colors duration-150 aria-pressed:font-bold"
    >
      <img
        data-theme-icon-option
        src="/icons/theme/matcha.svg"
        alt=""
        class="h-5 w-5"
      />
      <span class="text-sm font-medium">{{t:theme.matcha}}</span>
    </button>
  </li>
  <li>
    <button
      type="button"
      data-theme-option="cafe"
      aria-pressed="false"
      class="hover:bg-accent/10 aria-pressed:bg-accent/10 flex w-full cursor-pointer items-center gap-3 px-4 py-2.5 text-left transition-colors duration-150 aria-pressed:font-bold"
    >
      <img
        data-theme-icon-option
        src="/icons/theme/coffee.svg"
        alt=""
        class="h-5 w-5"
      />
      <span class="text-sm font-medium">{{t:theme.cafe}}</span>
    </button>
  </li>
  <li>
    <button
      type="button"
      data-theme-option="blue"
      aria-pressed="false"
      class="hover:bg-accent/10 aria-pressed:bg-accent/10 flex w-full cursor-pointer items-center gap-3 px-4 py-2.5 text-left transition-colors duration-150 aria-pressed:font-bold"
    >
      <img
        data-theme-icon-option
        src="/icons/theme/blue.svg"
        alt=""
        class="h-5 w-5"
      />
      <span class="text-sm font-medium">{{t:theme.blue}}</span>
    </button>
  </li>
  <li>
    <button
      type="button"
      data-theme-option="violet"
      aria-pressed="false"
      class="hover:bg-accent/10 aria-pressed:bg-accent/10 flex w-full cursor-pointer items-center gap-3 px-4 py-2.5 text-left transition-colors duration-150 aria-pressed:font-bold"
    >
      <img
        data-theme-icon-option

  </li>
</ul>
