<a
  href="#main-content"
  class="border-focus-ring bg-surface-container text-text-primary fixed top-2 left-2 z-60 -translate-y-24 rounded-lg border-2 px-4 py-2 font-medium focus-visible:translate-y-0 motion-safe:transition-transform motion-safe:duration-200"
>
  Saltar al contenido
</a>

<header
  data-site-header
  class="page-gutter theme-transition bg-surface-header sticky top-0 z-50 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 py-(--header-padding-y-compact) shadow-(shadow:--shadow-header) backdrop-blur-[12px] sm:py-(--header-padding-y)"
>
  <div class="flex items-center gap-2">
    <button
      type="button"
      popovertarget="site-menu"
      aria-label="Menú"
      class="text-text-primary flex size-(--header-button-size) items-center justify-center rounded-lg text-2xl transition-colors duration-200 hover:opacity-75 lg:hidden"
    >
      <span
        class="icon mask-[url(/icons/ui/menu.svg)]"
        aria-hidden="true"
      ></span>
    </button>
    <a href="/" class="flex items-center gap-3 text-inherit no-underline">
      <img
        src="/icons/logo.webp"
        alt="Café rico, inicio"
        class="size-(--brand-logo-size) rounded-lg object-cover shadow-sm"
        width="40"
        height="40"
      />
    </a>
  </div>

  <nav
    id="site-menu"
    popover
    aria-label="Navegación principal"
    class="border-border-subtle bg-surface-page text-text-primary fixed inset-x-0 top-[calc(var(--brand-logo-size)+1rem)] bottom-auto m-0 h-auto w-auto border-0 border-b p-4 sm:top-(--header-height) lg:static lg:block lg:overflow-visible lg:border-0 lg:bg-transparent lg:p-0"
  >
    <ul class="flex flex-col gap-1 lg:flex-row lg:items-center lg:gap-8">
      <li>
        <a
          href="/"
          class="text-text-primary block py-3 font-medium transition-colors duration-200 hover:opacity-75 lg:py-0"
        >
          Inicio
        </a>
      </li>
      <li>
        <a
          href="/src/pages/coffees.html"
          class="text-text-primary block py-3 font-medium transition-colors duration-200 hover:opacity-75 lg:py-0"
        >
          Caf&eacute;s
        </a>
      </li>
      <li>
        <a
          href="/src/pages/menu.html"
          class="text-text-primary block py-3 font-medium transition-colors duration-200 hover:opacity-75 lg:py-0"
        >
          Men&uacute;
        </a>
      </li>
      <li>
        <a
          href="/src/pages/about.html"
          class="text-text-primary block py-3 font-medium transition-colors duration-200 hover:opacity-75 lg:py-0"
        >
          Nuestra Historia
        </a>
      </li>
      <li>
        <a
          href="/src/pages/gallery.html"
          class="text-text-primary block py-3 font-medium transition-colors duration-200 hover:opacity-75 lg:py-0"
        >
          Galer&iacute;a
        </a>
      </li>
      <li>
        <a
          href="/src/pages/subscription.html"
          class="btn btn--primary block text-center lg:py-2"
        >
          Suscr&iacute;bete
        </a>
      </li>
    </ul>
  </nav>

  <theme-selector class="relative block"></theme-selector>
</header>
