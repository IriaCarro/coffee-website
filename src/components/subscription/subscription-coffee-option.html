<label
  class="border-border-input bg-surface-transparent hover:bg-accent/10 relative flex cursor-pointer items-center rounded-lg border-2 p-4 transition-all duration-300"
>
  <input type="radio" name="coffee" value="{{id}}" {{checked}} />
  <img
    class="ml-3 h-20 w-16 shrink-0 object-contain sm:ml-4"
    src="{{packImage200}}"
    srcset="{{packImage120}} 120w, {{packImage200}} 200w, {{packImage400}} 400w"
    sizes="64px"
    width="64"
    height="80"
    loading="lazy"
    decoding="async"
    alt="{{t:coffees.packAlt}} {{name}}, {{production}}"
  />
  <span class="ml-3 flex min-w-0 flex-1 flex-col sm:ml-4">
    <strong class="text-text-primary font-medium">{{name}}</strong>
    <span class="text-text-secondary text-sm">{{description}}</span>
    <span class="text-text-secondary text-sm">
      {{formattedPrice}}{{t:plans.perMonth}}
    </span>
  </span>
</label>
