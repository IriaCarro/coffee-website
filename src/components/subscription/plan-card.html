<li class="flex">
  <article
    data-featured="{{featured}}"
    class="group border-border-subtle bg-surface-container text-text-primary data-[featured=true]:border-accent relative flex w-full flex-col rounded-lg border-2 p-6 text-center shadow-md transition duration-300 hover:shadow-xl data-[featured=true]:shadow-xl hover:motion-safe:-translate-y-1 sm:p-8"
  >
    <span
      class="bg-accent text-text-on-accent absolute -top-3 left-1/2 hidden -translate-x-1/2 rounded-full px-3 py-0.5 text-xs font-bold whitespace-nowrap group-data-[featured=true]:block"
    >
      {{t:plans.popular}}
    </span>
    <h3 class="heading heading--item mb-2">{{name}}</h3>
    <p class="text-text-secondary mb-6">{{description}}</p>
    <p class="text-text-secondary mb-1 text-sm">{{t:plans.from}}</p>
    <p class="text-accent mb-6 text-3xl font-bold">
      {{fromPrice}}
      <span class="text-base font-medium">{{t:plans.perMonth}}</span>
    </p>
    <a
      href="/src/pages/subscription.html?plan={{id}}"
      class="btn btn--primary mt-auto inline-block no-underline"
    >
      {{t:plans.choose}}
      <span class="sr-only">{{name}}</span>
    </a>
  </article>
</li>
