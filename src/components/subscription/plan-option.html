<option-card
  group="plan"
  value="{{id}}"
  checked="{{checked}}"
  featured="{{featured}}"
>
  <span
    class="bg-accent text-text-on-accent absolute -top-3 right-4 hidden rounded-full px-3 py-0.5 text-xs font-bold group-data-[featured=true]:block"
  >
    {{t:plans.popular}}
  </span>
  <option-text heading="{{name}}" description="{{description}}"></option-text>
  <span class="text-accent font-bold" data-plan-price="{{bags}}">
    {{defaultPrice}}
  </span>
</option-card>
