<li>
  <details
    class="group overflow-hidden rounded-lg border border-l-4 border-(--border-subtle) bg-(--surface-container) transition-colors duration-300"
  >
    <summary
      class="flex cursor-pointer list-none items-center justify-between gap-3 p-4 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-(--focus-ring) sm:gap-4 sm:p-6 [&::-webkit-details-marker]:hidden"
    >
      <h3 class="text-base font-bold text-(--text-primary) sm:text-xl">
        {{question}}
      </h3>
      <span
        class="h-3 w-3 shrink-0 rotate-45 border-r-2 border-b-2 border-(--text-primary) group-open:-rotate-[135deg] motion-safe:transition-transform motion-safe:duration-300"
        aria-hidden="true"
      ></span>
    </summary>
    <p
      class="px-4 pb-4 leading-relaxed text-(--text-secondary) sm:px-6 sm:pb-6"
    >
      {{slot}}
    </p>
  </details>
</li>
