<dialog
  id="gallery__lightbox"
  aria-label="Imagen ampliada"
  class="bg-surface-transparent backdrop:bg-surface-modal-overlay m-auto h-screen max-h-none w-screen max-w-none p-2 backdrop:backdrop-blur-[4px] open:flex open:items-center open:justify-center open:gap-2 sm:p-4 sm:open:gap-4"
>
  <button
    type="button"
    class="gallery-lightbox__control gallery-lightbox__close absolute top-4 right-4"
    aria-label="Cerrar"
  >
    <span aria-hidden="true">&times;</span>
  </button>
  <button
    type="button"
    class="gallery-lightbox__control gallery-lightbox__prev"
    aria-label="Anterior"
  >
    <span aria-hidden="true">&#8249;</span>
  </button>
  <figure class="flex max-h-full min-w-0 flex-col items-center gap-4">
    <img
      class="max-h-[80vh] max-w-full rounded-lg object-contain shadow-2xl"
      alt=""
    />
    <figcaption
      class="text-text-on-image-muted text-center text-sm"
    ></figcaption>
  </figure>
  <button
    type="button"
    class="gallery-lightbox__control gallery-lightbox__next"
    aria-label="Siguiente"
  >
    <span aria-hidden="true">&#8250;</span>
  </button>
</dialog>
