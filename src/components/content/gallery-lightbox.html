<dialog
  id="gallery__lightbox"
  aria-label="{{t:gallery.lightbox.label}}"
  class="bg-surface-transparent backdrop:bg-surface-modal-overlay m-auto h-screen max-h-none w-screen max-w-none p-2 backdrop:backdrop-blur-[4px] open:flex open:items-center open:justify-center open:gap-2 sm:p-4 sm:open:gap-4"
>
  <button
    type="button"
    data-lightbox-action="close"
    class="gallery-lightbox__control absolute top-4 right-4"
    aria-label="{{t:gallery.lightbox.close}}"
  >
    <span class="icon mask-[url(/icons/ui/x.svg)]" aria-hidden="true"></span>
  </button>
  <button
    type="button"
    data-lightbox-action="previous"
    class="gallery-lightbox__control"
    aria-label="{{t:gallery.lightbox.previous}}"
  >
    <span
      class="icon mask-[url(/icons/ui/arrow-left.svg)]"
      aria-hidden="true"
    ></span>
  </button>
  <figure class="flex max-h-full min-w-0 flex-col items-center gap-4">
    <img
      class="max-h-[80vh] max-w-full rounded-lg object-contain shadow-2xl"
      alt=""
    />
    <figcaption
      class="text-text-on-image-muted text-center text-sm"
    ></figcaption>
  </figure>
  <button
    type="button"
    data-lightbox-action="next"
    class="gallery-lightbox__control"
    aria-label="{{t:gallery.lightbox.next}}"
  >
    <span
      class="icon mask-[url(/icons/ui/arrow-right.svg)]"
      aria-hidden="true"
    ></span>
  </button>
</dialog>
