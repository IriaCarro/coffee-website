<li>
  <details
    class="group border-border-subtle bg-surface-container overflow-hidden rounded-lg border border-l-4 transition-colors duration-300"
  >
    <summary
      class="focus-visible:outline-focus-ring flex cursor-pointer list-none items-center justify-between gap-3 p-4 focus-visible:outline-2 focus-visible:-outline-offset-2 sm:gap-4 sm:p-6 [&::-webkit-details-marker]:hidden"
    >
      <h3 class="text-text-primary text-base font-bold sm:text-xl">
        {{question}}
      </h3>
      <span
        class="border-text-primary h-3 w-3 shrink-0 rotate-45 border-r-2 border-b-2 group-open:-rotate-[135deg] motion-safe:transition-transform motion-safe:duration-300"
        aria-hidden="true"
      ></span>
    </summary>
    <p class="text-text-secondary px-4 pb-4 leading-relaxed sm:px-6 sm:pb-6">
      {{answer}}
    </p>
  </details>
</li>
