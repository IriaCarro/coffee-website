<li class="coffee-card">
  <a href="/coffees/{{id}}/" class="coffee-card__link hover-zoom">
    <article>
      <div class="coffee-card__media">
        <img
          class="coffee-card__backdrop"
          src="{{packImage}}"
          srcset="{{packImage400}} 400w, {{packImage}} 800w"
          sizes="(min-width: 1280px) 160px, (min-width: 1024px) 33vw, (min-width: 640px) 50vw, 160px"
          alt=""
          aria-hidden="true"
        />
        <img
          class="coffee-card__image hover-zoom__target"
          src="{{packImage}}"
          srcset="{{packImage400}} 400w, {{packImage}} 800w"
          sizes="(min-width: 1280px) 160px, (min-width: 1024px) 33vw, (min-width: 640px) 50vw, 160px"
          alt="Pack de café {{name}}, {{production}}"
        />
      </div>
      <div class="coffee-card__content">
        <h3 class="coffee-card__title">{{name}}</h3>
        <p class="coffee-card__description">{{description}}</p>
        <p class="coffee-card__price">{{formattedPrice}}</p>
      </div>
    </article>
  </a>
</li>
