<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Preguntas frecuentes sobre Café Rico." />
    <title>Preguntas Frecuentes - Café Rico</title>
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/favicon-16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/icons/favicon-96.png"
    />
    <script src="/theme-init.js"></script>
    <link rel="stylesheet" href="/src/styles/index.css" />
    <script type="module" src="/src/js/main.js"></script>
  </head>

  <body>
    <app-header></app-header>

    <main id="main-content">
      <section class="page" aria-labelledby="faq__title">
        <div class="mx-auto max-w-3xl">
          <back-link></back-link>

          <page-header heading-id="faq__title" heading="Preguntas Frecuentes">
            <p class="lead">
              Encuentra respuestas a las preguntas más comunes sobre nuestros
              cafés y servicios
            </p>
          </page-header>

          <h2 class="sr-only" id="faq__list-title">Lista de preguntas</h2>
          <ul class="space-y-4" role="list" aria-labelledby="faq__list-title">
            <repeat data="faq" component="faq-item"></repeat>
          </ul>

          <div
            class="bg-surface-container mt-12 rounded-lg p-5 text-center sm:p-8"
          >
            <h2 class="heading heading--section mb-4">
              ¿No encontraste tu respuesta?
            </h2>
            <p class="lead mb-6">
              Estamos aquí para ayudarte. Contáctanos directamente:
            </p>
            <a
              href="mailto:caferico@correo.com"
              class="btn btn--primary inline-block"
            >
              Enviar Email
            </a>
          </div>
        </div>
      </section>
    </main>

    <app-footer></app-footer>
  </body>
</html>
