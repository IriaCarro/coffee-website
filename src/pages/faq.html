<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{t:faq.meta.description}}" />
    <title>{{t:faq.meta.title}}</title>
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/favicon-16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/icons/favicon-96.png"
    />
    <script src="/theme-init.js"></script>
    <link rel="stylesheet" href="/src/styles/index.css" />
    <script type="module" src="/src/js/main.js"></script>
  </head>

  <body>
    <app-header></app-header>

    <main id="main-content">
      <section class="page" aria-labelledby="faq__title">
        <div class="mx-auto max-w-3xl">
          <back-link></back-link>

          <page-header heading-id="faq__title" heading="{{t:faq.title}}">
            <p class="lead">{{t:faq.lead}}</p>
          </page-header>

          <h2 class="sr-only" id="faq__list-title">{{t:faq.listTitle}}</h2>
          <ul class="space-y-4" role="list" aria-labelledby="faq__list-title">
            <repeat data="faq" component="faq-item"></repeat>
          </ul>

          <cta-card
            heading-id="faq__help-title"
            heading="{{t:faq.help.title}}"
            href="mailto:{{data:shop.email}}"
            label="{{t:faq.help.button}}"
            class="mt-12"
          >
            {{t:faq.help.text}}
          </cta-card>
        </div>
      </section>
    </main>

    <app-footer></app-footer>
  </body>
</html>
