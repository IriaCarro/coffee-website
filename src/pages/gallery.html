<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{t:gallery.meta.description}}" />
    <title>{{t:gallery.meta.title}}</title>
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/favicon-16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/icons/favicon-96.png"
    />
    <script src="/theme-init.js"></script>
    <link rel="stylesheet" href="/src/styles/index.css" />
    <script type="module" src="/src/js/main.js"></script>
    <script type="module" src="/src/js/utils/gallery-lightbox.js"></script>
  </head>

  <body>
    <app-header></app-header>

    <main id="main-content">
      <section
        class="bg-surface-page px-4 py-8 transition-colors duration-300 sm:px-6 sm:py-12 lg:px-8"
        aria-labelledby="gallery__title"
      >
        <div class="mx-auto max-w-6xl">
          <back-link></back-link>

          <page-header
            heading-id="gallery__title"
            heading="{{t:gallery.title}}"
            class="enter-fade-up mb-8 text-center sm:mb-12"
          >
            <p class="lead">{{t:gallery.lead}}</p>
          </page-header>

          <!-- Gallery Grid (expanded at build from gallery.json) -->
          <h2 class="sr-only">{{t:gallery.listTitle}}</h2>
          <ul
            data-gallery
            class="mb-8 grid grid-cols-1 gap-6 sm:mb-12 md:grid-cols-2 lg:auto-rows-[15rem] lg:grid-cols-3"
            role="list"
          >
            <repeat data="gallery" component="gallery-item"></repeat>
          </ul>

          <cta-card
            heading-id="gallery__cta-title"
            heading="{{t:gallery.cta.title}}"
            href="/src/pages/subscription.html"
            label="{{t:gallery.cta.button}}"
          >
            {{t:gallery.cta.text}}
          </cta-card>
        </div>
      </section>
    </main>

    <gallery-lightbox></gallery-lightbox>

    <app-footer></app-footer>
  </body>
</html>
