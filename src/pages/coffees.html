<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{t:coffees.meta.description}}" />
    <title>{{t:coffees.meta.title}}</title>
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/favicon-16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/icons/favicon-96.png"
    />
    <script src="/theme-init.js"></script>
    <link rel="stylesheet" href="/src/styles/index.css" />
    <script type="module" src="/src/js/main.js"></script>
  </head>

  <body>
    <app-header></app-header>

    <main id="main-content">
      <section class="page" aria-labelledby="coffees__title">
        <div class="mx-auto max-w-6xl">
          <back-link></back-link>

          <page-header
            heading-id="coffees__title"
            heading="{{t:coffees.title}}"
            class="enter-fade-up mb-8 text-center sm:mb-12"
          >
            <p class="lead">{{t:coffees.lead}}</p>
          </page-header>

          <h2 class="sr-only">{{t:coffees.listTitle}}</h2>
          <ul
            id="coffees__grid"
            class="enter-fade-up grid gap-6 sm:grid-cols-2 sm:gap-8 lg:grid-cols-3"
          >
            <repeat data="coffees" component="coffee-card"></repeat>
          </ul>
        </div>
      </section>
    </main>

    <app-footer></app-footer>
  </body>
</html>
