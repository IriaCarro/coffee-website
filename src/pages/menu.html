<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{t:menu.meta.description}}" />
    <title>{{t:menu.meta.title}}</title>
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/favicon-16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/icons/favicon-96.png"
    />
    <script src="/theme-init.js"></script>
    <link rel="stylesheet" href="/src/styles/index.css" />
    <script type="module" src="/src/js/main.js"></script>
  </head>

  <body>
    <app-header></app-header>

    <main id="main-content">
      <section class="page" aria-labelledby="menu__title">
        <div class="mx-auto max-w-6xl">
          <back-link></back-link>

          <page-header
            heading-id="menu__title"
            heading="{{t:menu.title}}"
            class="enter-fade-up mb-8 text-center sm:mb-12"
          >
            <p class="lead">{{t:menu.lead}}</p>
          </page-header>

          <h2 class="sr-only">{{t:menu.listTitle}}</h2>
          <ul
            id="menu__list"
            class="enter-fade-up grid auto-rows-fr gap-6 sm:grid-cols-2 sm:gap-8 lg:grid-cols-3"
          >
            <repeat data="menu" component="menu-item"></repeat>
          </ul>

          <section
            class="mt-12 grid items-center gap-6 sm:mt-16 md:grid-cols-2 md:gap-10"
            aria-labelledby="menu__special-title"
          >
            <figure class="overflow-hidden rounded-lg shadow-lg">
              <img
                class="aspect-3/2 h-auto w-full object-cover"
                src="/photos/tortitas-800.webp"
                srcset="
                  /photos/tortitas-400.webp   400w,
                  /photos/tortitas-800.webp   800w,
                  /photos/tortitas-1200.webp 1200w
                "
                sizes="(min-width: 1152px) 560px, (min-width: 640px) 50vw, 100vw"
                width="1200"
                height="800"
                loading="lazy"
                decoding="async"
                alt="{{t:menu.special.imageAlt}}"
              />
            </figure>
            <div class="menu-special__content">
              <p
                class="text-accent mb-2 text-sm font-bold tracking-[0.16em] uppercase"
              >
                {{t:menu.special.badge}}
              </p>
              <h2
                class="text-text-primary mb-3 text-3xl font-bold sm:text-4xl"
                id="menu__special-title"
              >
                {{t:menu.special.title}}
              </h2>
              <p class="text-text-secondary mb-4 text-lg">
                {{t:menu.special.text}}
              </p>
              <p class="text-accent text-2xl font-bold">7,50 €</p>
            </div>
          </section>
        </div>
      </section>
    </main>

    <app-footer></app-footer>
  </body>
</html>
